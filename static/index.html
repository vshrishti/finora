<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finora</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen font-outfit">

    <div class="flex h-screen overflow-hidden">
        
        <!-- Sidebar -->
        <aside class="w-64 bg-white border-r border-slate-200 flex flex-col transition-all duration-300">
            <div class="p-6">
                <h1 class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-emerald-500 to-teal-400">💰 Finora</h1>
            </div>
            <nav class="flex-1 px-4 space-y-2">
                <a href="#" class="nav-item active flex items-center px-4 py-3 rounded-xl transition-all font-medium text-emerald-700 bg-emerald-50">
                    <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                    Dashboard
                </a>
            </nav>
            <div class="p-4 border-t border-slate-100">
                <button id="loadDemoBtn" class="w-full flex items-center justify-center px-4 py-2 text-sm font-medium text-emerald-600 bg-emerald-50 rounded-lg hover:bg-emerald-100 transition-colors">
                    🔄 Load Demo Data
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 overflow-y-auto bg-slate-50 relative">
            <div class="absolute inset-0 bg-gradient-to-br from-emerald-500/5 to-teal-400/5 z-0"></div>
            
            <div class="relative z-10 max-w-7xl mx-auto px-8 py-10">
                <header class="flex justify-between items-center mb-10">
                    <div>
                        <h2 class="text-3xl font-bold text-slate-800">Financial Overview</h2>
                        <p class="text-slate-500 mt-1">Track and analyze your spending patterns</p>
                    </div>
                    <button id="addTxBtn" class="flex items-center px-4 py-2.5 bg-emerald-600 text-white rounded-xl font-medium shadow-lg shadow-emerald-200 hover:bg-emerald-700 hover:shadow-emerald-300 transition-all">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                        Add Transaction
                    </button>
                </header>

                <!-- Metrics Grid -->
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-10">
                    <div class="glass-card rounded-2xl p-6 relative overflow-hidden group">
                        <div class="absolute top-0 right-0 w-24 h-24 bg-emerald-100 rounded-full -mr-12 -mt-12 transition-transform group-hover:scale-110"></div>
                        <p class="text-slate-500 text-sm font-medium mb-1 relative z-10">Total Income</p>
                        <h3 class="text-3xl font-bold text-slate-800 relative z-10" id="valIncome">₹0</h3>
                    </div>
                    
                    <div class="glass-card rounded-2xl p-6 relative overflow-hidden group">
                        <div class="absolute top-0 right-0 w-24 h-24 bg-rose-100 rounded-full -mr-12 -mt-12 transition-transform group-hover:scale-110"></div>
                        <p class="text-slate-500 text-sm font-medium mb-1 relative z-10">Total Expenses</p>
                        <h3 class="text-3xl font-bold text-slate-800 relative z-10" id="valExpense">₹0</h3>
                    </div>
                    
                    <div class="glass-card rounded-2xl p-6 relative overflow-hidden group">
                        <div class="absolute top-0 right-0 w-24 h-24 bg-blue-100 rounded-full -mr-12 -mt-12 transition-transform group-hover:scale-110"></div>
                        <p class="text-slate-500 text-sm font-medium mb-1 relative z-10">Total Savings</p>
                        <h3 class="text-3xl font-bold text-slate-800 relative z-10" id="valSavings">₹0</h3>
                    </div>

                    <div class="glass-card rounded-2xl p-6 relative overflow-hidden group border-l-4 border-emerald-500">
                        <p class="text-slate-500 text-sm font-medium mb-1">Savings Rate</p>
                        <h3 class="text-3xl font-bold text-slate-800" id="valRate">0%</h3>
                        <div class="w-full bg-slate-100 rounded-full h-1.5 mt-4">
                            <div class="bg-emerald-500 h-1.5 rounded-full" id="rateBar" style="width: 0%"></div>
                        </div>
                    </div>
                </div>

                <!-- Charts Section -->
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-10">
                    <div class="lg:col-span-2 glass-card rounded-2xl p-6">
                        <h3 class="text-lg font-semibold mb-6">Daily Spending Trend</h3>
                        <div class="h-72">
                            <canvas id="trendChart"></canvas>
                        </div>
                    </div>
                    <div class="glass-card rounded-2xl p-6">
                        <h3 class="text-lg font-semibold mb-6">Expenses by Category</h3>
                        <div class="h-72 relative flex items-center justify-center">
                            <canvas id="categoryChart"></canvas>
                        </div>
                    </div>
                </div>

                <!-- Recent Transactions -->
                <div class="glass-card rounded-2xl overflow-hidden">
                    <div class="px-6 py-5 border-b border-slate-100 flex justify-between items-center">
                        <h3 class="text-lg font-semibold">Recent Transactions</h3>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-slate-50/50 text-slate-500 text-sm">
                                    <th class="px-6 py-4 font-medium">Date</th>
                                    <th class="px-6 py-4 font-medium">Type</th>
                                    <th class="px-6 py-4 font-medium">Category</th>
                                    <th class="px-6 py-4 font-medium">Description</th>
                                    <th class="px-6 py-4 font-medium text-right">Amount</th>
                                </tr>
                            </thead>
                            <tbody id="txTableBody" class="divide-y divide-slate-100 text-sm">
                                <!-- Populated by JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
                
            </div>
        </main>
    </div>

    <!-- Add Transaction Modal -->
    <div id="txModal" class="fixed inset-0 z-50 hidden bg-slate-900/50 backdrop-blur-sm flex items-center justify-center transition-opacity opacity-0">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden transform scale-95 transition-transform duration-300">
            <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <h3 class="text-lg font-bold text-slate-800">Add Transaction</h3>
                <button id="closeModalBtn" class="text-slate-400 hover:text-slate-600 transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div class="p-6">
                <form id="txForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Date</label>
                        <input type="date" id="txDate" required class="w-full px-4 py-2 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition-all">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Type</label>
                            <select id="txType" required class="w-full px-4 py-2 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition-all">
                                <option value="Expense">Expense</option>
                                <option value="Income">Income</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Amount</label>
                            <input type="number" id="txAmount" min="0.01" step="0.01" required placeholder="0.00" class="w-full px-4 py-2 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition-all">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Category</label>
                        <select id="txCategory" required class="w-full px-4 py-2 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition-all">
                            <option value="Food">Food</option>
                            <option value="Transport">Transport</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Bills">Bills</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Salary">Salary</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Description</label>
                        <input type="text" id="txDesc" placeholder="What was this for?" class="w-full px-4 py-2 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition-all">
                    </div>
                    <div class="pt-2">
                        <button type="submit" class="w-full py-2.5 bg-emerald-600 text-white rounded-xl font-medium shadow-lg shadow-emerald-200 hover:bg-emerald-700 transition-all">
                            Save Transaction
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
